name: Generate approved brand assets

on:
  push:
    branches:
      - brand/approved-harbourcart-assets-20260928
    paths:
      - "scripts/generate-brand-assets.py"
      - "scripts/brand-masters/**"
      - ".github/workflows/brand-assets.yml"

permissions:
  contents: write

concurrency:
  group: harbourcart-brand-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout brand branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate each handoff asset
        run: python scripts/generate-brand-assets.py

      - name: Commit generated assets
        run: |
          if git diff --quiet -- public/brand; then
            echo "Brand assets already match generator output."
            exit 0
          fi
          git config user.name "HarbourCart Brand Assets"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand
          git commit -m "brand: add approved HarbourCart asset suite [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
